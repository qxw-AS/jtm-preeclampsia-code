name: jtm-preeclampsia
channels:
  - conda-forge
dependencies:
  - python=3.14.7
  - pip
  # versions verified in the archived analysis environment
  - numpy=2.5.3
  - pandas=3.0.6
  - scipy=1.18.1
  - matplotlib=3.11.2
  - requests=2.34.2
  - openpyxl=3.1.5
  - pip:
      # single-cell stack (minimum versions; freeze with `conda env export`
      # on the original machine before archiving)
      - scanpy>=1.10.0
      - anndata>=0.10.0
      - scdrs>=1.0.2
      - harmonypy>=0.0.10
      - scikit-learn>=1.3.0
      - h5py>=3.10.0
      - igraph>=0.11.0
      - leidenalg>=0.10.0
      - numba>=0.59.0
      # MR / summary-statistics stack
      - statsmodels>=0.14.0
      - pysam>=0.22.0
      # enrichment (used by code outside the P0 set)
      - gseapy>=1.1.0

# External binaries are NOT installable through this file:
#   MAGMA v1.10   https://cncr.nl/research/magma/  (reference panel: 1000G EUR)
#   CellChat v1.6 R package (P1 cell-cell communication analysis only)
